<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="14">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3641"/></marker>
  </defs>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2730">Live calorimeter monitoring: data path (design + prototype)</text>

  <!-- sources -->
  <g>
    <rect x="20" y="80" width="150" height="200" rx="12" fill="#e7f2f1" stroke="#0f5f59"/>
    <text x="95" y="110" text-anchor="middle" font-weight="700" fill="#0f5f59">50 sectors</text>
    <text x="95" y="132" text-anchor="middle" fill="#2b3641">ADC64 boards</text>
    <text x="95" y="160" text-anchor="middle" fill="#2b3641">38,400 channels</text>
    <text x="95" y="182" text-anchor="middle" fill="#2b3641">60 samples each</text>
    <text x="95" y="220" text-anchor="middle" fill="#5c6976" font-size="12">1,000 events/s</text>
    <text x="95" y="238" text-anchor="middle" fill="#5c6976" font-size="12">≈ 4.6 GB/s raw</text>
  </g>

  <!-- receiver -->
  <rect x="215" y="110" width="160" height="140" rx="12" fill="#fff4e0" stroke="#915407"/>
  <text x="295" y="140" text-anchor="middle" font-weight="700" fill="#915407">TCP / TLV receiver</text>
  <text x="295" y="164" text-anchor="middle" fill="#2b3641">C++17, streaming</text>
  <text x="295" y="186" text-anchor="middle" fill="#2b3641">zero-allocation</text>
  <text x="295" y="208" text-anchor="middle" fill="#2b3641">waveform reducer</text>
  <text x="295" y="232" text-anchor="middle" fill="#5c6976" font-size="12">Python reference impl.</text>

  <!-- queue -->
  <rect x="420" y="110" width="140" height="140" rx="12" fill="#f5f4ef" stroke="#5c6976"/>
  <text x="490" y="140" text-anchor="middle" font-weight="700" fill="#1f2730">Segment queue</text>
  <g fill="#d8d2c3" stroke="#b8ae97">
    <rect x="445" y="160" width="90" height="14" rx="3"/><rect x="445" y="180" width="90" height="14" rx="3"/><rect x="445" y="200" width="90" height="14" rx="3"/>
  </g>
  <text x="490" y="236" text-anchor="middle" fill="#5c6976" font-size="12">back-pressure, replay</text>

  <!-- writers / metrics -->
  <rect x="605" y="70" width="170" height="100" rx="12" fill="#e7f2f1" stroke="#0f5f59"/>
  <text x="690" y="100" text-anchor="middle" font-weight="700" fill="#0f5f59">Per-channel metrics</text>
  <text x="690" y="124" text-anchor="middle" fill="#2b3641">pedestal, amplitude,</text>
  <text x="690" y="146" text-anchor="middle" fill="#2b3641">tail stats, rates</text>

  <rect x="605" y="200" width="170" height="100" rx="12" fill="#e7f2f1" stroke="#0f5f59"/>
  <text x="690" y="230" text-anchor="middle" font-weight="700" fill="#0f5f59">PostgreSQL</text>
  <text x="690" y="254" text-anchor="middle" fill="#2b3641">COPY writer pool</text>
  <text x="690" y="276" text-anchor="middle" fill="#5c6976" font-size="12">bulk ingest</text>

  <rect x="815" y="135" width="125" height="100" rx="12" fill="#fff4e0" stroke="#915407"/>
  <text x="877" y="165" text-anchor="middle" font-weight="700" fill="#915407">Live UI</text>
  <text x="877" y="189" text-anchor="middle" fill="#2b3641">38,400-cell</text>
  <text x="877" y="211" text-anchor="middle" fill="#2b3641">maps + alerts</text>

  <g stroke="#2b3641" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M170,180 H212"/>
    <path d="M375,180 H417"/>
    <path d="M560,160 C585,140 585,120 602,120"/>
    <path d="M560,200 C585,220 585,250 602,250"/>
    <path d="M775,120 C800,120 800,170 812,175"/>
    <path d="M775,250 C800,250 800,200 812,195"/>
  </g>
  <text x="480" y="335" text-anchor="middle" fill="#5c6976" font-size="12">Containerised with Docker Compose · benchmarked on replayed DAQ captures</text>
</svg>
